<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#18202a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cnation Book" />
    <meta
      name="description"
      content="의학 장편소설을 읽는 온라인 서재. 이어 읽기, 책갈피, 맞춤 독서 설정을 지원합니다."
    />
    <link rel="preload" href="./fonts/noto-serif-kr-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/noto-serif-kr-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/noto-sans-kr-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/noto-sans-kr-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Cnation Book</title>
  </head>
  <body>
    <main id="bookshelf" class="library bookshelf" aria-labelledby="bookshelf-title">
      <header class="library-header">
        <div class="brand-mark" aria-hidden="true">冊</div>
        <div>
          <p class="eyebrow">CNATION BOOK</p>
          <h1 id="bookshelf-title">나의 서재</h1>
          <p class="library-subtitle">읽을 작품을 선택하세요</p>
        </div>
        <div class="library-actions">
          <button id="install-app" class="quiet-button install-button" type="button" hidden>
            <span aria-hidden="true">↓</span> 앱 설치
          </button>
        </div>
      </header>

      <section class="book-section" aria-labelledby="book-list-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">작품</p>
            <h2 id="book-list-title">어떤 이야기를 읽을까요?</h2>
          </div>
          <p>작품을 선택하면 권 목록으로 들어갑니다.</p>
        </div>
        <div id="book-grid" class="book-grid" aria-live="polite"></div>
      </section>
    </main>

    <main id="library" class="library" aria-labelledby="library-title" hidden>
      <header class="library-header">
        <div id="library-mark" class="brand-mark" aria-hidden="true">崔</div>
        <div>
          <p id="library-label" class="eyebrow">조석호 장편소설</p>
          <h1 id="library-title">닥터 최태수</h1>
          <p id="library-subtitle" class="library-subtitle">전 27권 · 3,236화</p>
        </div>
        <div class="library-actions">
          <button id="back-to-bookshelf" class="quiet-button" type="button">
            <span aria-hidden="true">←</span> 작품 선택
          </button>
          <button id="library-bookmarks" class="quiet-button" type="button" aria-label="저장한 책갈피 보기">
            <span aria-hidden="true">⌑</span> 책갈피
          </button>
        </div>
      </header>

      <section id="continue-section" class="continue-section" hidden>
        <button id="continue-button" class="continue-card" type="button">
          <span class="continue-kicker">이어 읽기</span>
          <strong id="continue-title">1권 · 1화</strong>
          <span id="continue-meta">읽던 페이지로 돌아갑니다</span>
          <span class="continue-arrow" aria-hidden="true">→</span>
        </button>
      </section>

      <section class="volume-section" aria-labelledby="volume-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">서재</p>
            <h2 id="volume-title">어느 권을 읽을까요?</h2>
          </div>
          <p>선택하면 첫 화부터 바로 열립니다.</p>
        </div>
        <div id="volume-grid" class="volume-grid" aria-live="polite"></div>
      </section>
    </main>

    <section id="reader" class="reader" hidden aria-label="책 읽기">
      <header class="reader-toolbar">
        <button id="back-to-library" class="icon-button" type="button" aria-label="서재로 돌아가기">←</button>
        <div class="reader-location">
          <select id="volume-select" aria-label="권 선택"></select>
          <span aria-hidden="true">·</span>
          <select id="chapter-select" aria-label="회차 선택"></select>
        </div>
        <div class="toolbar-actions">
          <button id="bookmark-button" class="icon-button bookmark-button" type="button" aria-label="현재 페이지 책갈피">
            ♧
          </button>
          <button id="settings-button" class="icon-button" type="button" aria-label="독서 설정">Aa</button>
        </div>
      </header>

      <div id="reading-stage" class="reading-stage">
        <button id="previous-page" class="page-turn page-turn-previous" type="button" aria-label="이전 페이지">‹</button>

        <div id="book" class="book" aria-live="polite" aria-busy="false">
          <div class="book-edge book-edge-left" aria-hidden="true"></div>
          <article id="left-page" class="paper-page paper-page-left">
            <div class="page-running-head" id="left-running-head"></div>
            <div class="page-content" id="left-page-content"></div>
            <div class="page-number" id="left-page-number"></div>
          </article>
          <div class="book-spine" aria-hidden="true"></div>
          <article id="right-page" class="paper-page paper-page-right">
            <div class="page-running-head" id="right-running-head"></div>
            <div class="page-content" id="right-page-content"></div>
            <div class="page-number" id="right-page-number"></div>
          </article>
          <div class="book-edge book-edge-right" aria-hidden="true"></div>
        </div>

        <button id="next-page" class="page-turn page-turn-next" type="button" aria-label="다음 페이지">›</button>
      </div>

      <footer class="reader-footer">
        <span id="progress-label">1화 · 1쪽</span>
        <input id="page-progress" type="range" min="0" max="0" value="0" aria-label="현재 회차 페이지 이동" />
        <span id="volume-progress">1권 0%</span>
      </footer>
    </section>

    <dialog id="settings-dialog" class="panel-dialog">
      <form method="dialog" class="panel-card">
        <header class="panel-header">
          <div>
            <p class="eyebrow">읽기 환경</p>
            <h2>독서 설정</h2>
          </div>
          <button class="icon-button panel-close" value="close" aria-label="설정 닫기">×</button>
        </header>

        <label class="setting-field">
          <span>글꼴</span>
          <select id="font-select">
            <option value="noto-serif">본명조</option>
            <option value="gowun">고운바탕</option>
            <option value="nanum">나눔명조</option>
            <option value="noto-sans">본고딕</option>
          </select>
        </label>

        <label class="setting-field">
          <span>본문 글자 굵기</span>
          <select id="font-weight">
            <option value="400">보통</option>
            <option value="700">굵게</option>
          </select>
        </label>

        <label class="setting-field">
          <span>글자 크기 <output id="font-size-output">19px</output></span>
          <input id="font-size" type="range" min="16" max="28" step="1" value="19" />
        </label>

        <label class="setting-field">
          <span>줄 간격 <output id="line-height-output">1.90</output></span>
          <input id="line-height" type="range" min="1.5" max="2.3" step="0.05" value="1.9" />
        </label>

        <label class="setting-field">
          <span>문단 간격 <output id="paragraph-gap-output">0.55em</output></span>
          <input id="paragraph-gap" type="range" min="0" max="1.4" step="0.05" value="0.55" />
        </label>

        <label class="setting-field">
          <span>페이지 여백 <output id="page-padding-output">26px</output></span>
          <input id="page-padding" type="range" min="12" max="76" step="2" value="26" />
        </label>

        <button id="reset-settings" class="secondary-button" type="button">기본값으로 되돌리기</button>
      </form>
    </dialog>

    <dialog id="bookmarks-dialog" class="panel-dialog bookmarks-dialog">
      <div class="panel-card">
        <header class="panel-header">
          <div>
            <p class="eyebrow">저장한 위치</p>
            <h2>책갈피</h2>
          </div>
          <button id="close-bookmarks" class="icon-button panel-close" type="button" aria-label="책갈피 닫기">×</button>
        </header>
        <div id="bookmarks-list" class="bookmarks-list"></div>
      </div>
    </dialog>

    <div id="loading" class="loading-overlay" hidden>
      <div class="loading-book" aria-hidden="true"><span></span><span></span></div>
      <p id="loading-message">책을 펼치고 있습니다…</p>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="measure-page" class="measure-page" aria-hidden="true"></div>

    <script src="./app.js" defer></script>
  </body>
</html>
